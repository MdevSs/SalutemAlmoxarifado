[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "salutem-almoxarifado-api"
version = "0.1.0"
description = "API do sistema de requisições de almoxarifado Salutem Hospitalares"
requires-python = ">=3.12.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "tzdata>=2025.2,<2027",
  "pwdlib[argon2]>=0.2.1,<1.0",
  "itsdangerous>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv]
required-version = "==0.12.19"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
